id: worldgate
title: Nether and End access
summary: Why a portal sometimes refuses you, what "drained" and "closed" mean, and how to check.
intro: |
  The owners can shut the Nether or the End, for example for an event or a world reset. This page shows how to tell what is going on.
icon: NETHER_PORTAL
category: Worlds
order: 30
module: worldgate
aliases: [nether, end, portal, portals, dimensions, wgate, locked, drained]
keywords: [closed, locked, enter, refused, evacuate, dimension, the-end]
commands: [worldgate]
related: [worldgate-admin]
sections:
  - question: Can I go to the Nether and the End?
    title: Is it open?
    text: |
      Usually, yes. {run:/worldgate status} shows whether the Nether and the End are <white>OPEN</white>, <white>DRAINED</white> or <white>CLOSED</white>.
      Which worlds those are is set by the owners: the Nether is <white>{setting:worldgate:nether-world}</white> and the End is <white>{setting:worldgate:end-world}</white>.
  - question: What does "drained" mean?
    title: Drained
    text: |
      The dimension is winding down: nobody <i>new</i> may enter, but whoever is already inside may walk out any time. Staff use it before a reset, so the dimension empties by itself. It is temporary, so come back later.
  - question: What does "closed" mean?
    title: Closed
    text: |
      The same rule as drained: no new arrivals. The message says the dimension is closed on this server, and it stays that way until staff open it again.
  - question: A portal does nothing. Why?
    title: Refused portals
    text: |
      If the destination is drained or closed, the portal is cancelled and you get a line saying so. That goes for nether portals, end portals and commands that take you there directly, like a warp or a world teleport.
      Going <i>back</i> out of a locked dimension is never blocked.
  - question: What if I'm inside when it locks?
    title: Evacuation
    text: |
      You can always leave on your own. Staff can also evacuate the dimension. You are told "You have been pulled out" and moved to your bed or respawn point if it is in the overworld, otherwise to the overworld's spawn. A bed in the Nether would send you straight back.
      {if:@perm:rainsworldgate.bypass}You hold the bypass, so no door is ever shut to you.{/if}
